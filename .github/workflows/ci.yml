name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build both applications
        run: pnpm build

      - name: Dry-run itsvari Worker deployment
        run: pnpm --filter @itsvari/web exec wrangler deploy --dry-run

      - name: Dry-run v4ri Worker deployment
        run: pnpm --filter @itsvari/music exec wrangler deploy --dry-run
